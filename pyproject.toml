[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "pdn-sync"
version = "0.1.0"
description = "Continuous, two-gate multimodal knowledge ingestion pipeline for Pusat Darah Negara (PDN)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14.0",
    "apscheduler>=3.11.0,<4.0.0",
    "beautifulsoup4>=4.13.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "lxml>=5.3.0",
    "pillow>=11.0.0",
    "prometheus-client>=0.21.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "qdrant-client>=1.16.0",
    "rapidfuzz>=3.10.0",
    "ruamel.yaml>=0.18.0",
    "sqlalchemy>=2.0.36",
    "structlog>=24.4.0",
    "typer>=0.15.0",
    "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
pdf = [
    "docling>=2.59.0",
]
ocr = [
    "paddlepaddle>=3.0.0",
    "paddleocr>=3.0.0",
]
embeddings = [
    "sentence-transformers>=5.0.0",
]
all = [
    "pdn-sync[pdf,ocr,embeddings]",
]

[project.scripts]
pdn-sync = "pdn_sync.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.14.0",
    "pytest>=8.3.0",
    "ruff>=0.9.0",
    "types-beautifulsoup4>=4.12.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pdn_sync"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
mypy_path = "src"
packages = ["pdn_sync"]

[[tool.mypy.overrides]]
module = [
    "paddleocr",
    "docling",
    "docling.*",
    "psutil",
    "apscheduler.*",
    "sentence_transformers",
    "sentence_transformers.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
