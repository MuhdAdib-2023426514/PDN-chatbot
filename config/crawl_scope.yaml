      reason: decorative_tool_logos_excluded_at_gate_a
    - id: exclude-media-sosial-logos
      pattern: /v2/media_sosial_pdn/logo/**
      reason: decorative_tool_logos_excluded_at_gate_a
    - id: exclude-pengurusan-tenaga-icons
      pattern: /v2/pengurusan-tenaga/_images/icon*
      reason: decorative_icons_excluded_at_gate_a
    - id: exclude-pengurusan-tenaga-logos
      pattern: /v2/pengurusan-tenaga/_images/Logo_*
      reason: decorative_logos_excluded_at_gate_a
