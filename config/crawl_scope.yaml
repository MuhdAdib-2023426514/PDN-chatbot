# PDN Multimodal Knowledge Sync — Crawl Scope (Gate A Single Source of Truth)
#
# IMPORTANT:
# - This file is human-owned and is the ONLY authority for content-scraping scope.
# - Discovery NEVER overwrites this file; discovery writes proposals to
#   data/discovery/crawl_scope.proposed.yaml.
# - Precedence (highest first):
#     1. Explicit URL exclusion
#     2. Pattern exclusion
#     3. Explicit URL approval
#     4. Pattern approval
#     5. Default: pending (not crawl-eligible)
# - Broad cross-directory wildcards (/**) are allowed ONLY in exclusions,
#   never in approvals.

schema_version: 1
allowed_host: pdn.gov.my
allowed_path_prefix: /v2

