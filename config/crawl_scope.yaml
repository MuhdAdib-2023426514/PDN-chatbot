  patterns:
    # Phase 4 JEvents boundary: exclude runaway/duplicate calendar views while allowing
    # ONLY bounded monthcalendar (current + 3 months) and eventdetail approvals below.
    - id: exclude-jevents-eventsbyweek
      pattern: "/v2/index.php/component/jevents/eventsbyweek/**"
      reason: non_target_jevents_view
    - id: exclude-jevents-eventsbyday
      pattern: "/v2/index.php/component/jevents/eventsbyday/**"
      reason: non_target_jevents_view
    - id: exclude-jevents-eventsbyyear
      pattern: "/v2/index.php/component/jevents/eventsbyyear/**"
      reason: non_target_jevents_view
    - id: exclude-jevents-eventsbymonth
      pattern: "/v2/index.php/component/jevents/eventsbymonth/**"
      reason: non_target_jevents_view
    - id: exclude-jevents-icalrepeat
      pattern: "/v2/index.php/component/jevents/icalrepeat*/**"
      reason: non_target_jevents_view
    - id: exclude-jevents-icalevent
      pattern: "/v2/index.php/component/jevents/icalevent*/**"
      reason: non_target_jevents_view
    - id: exclude-jevents-search
      pattern: "/v2/index.php/component/jevents/search*/**"
      reason: non_target_jevents_view
    - id: exclude-jevents-range
      pattern: "/v2/index.php/component/jevents/range*/**"
      reason: non_target_jevents_view
    - id: exclude-jevents-crawler
      pattern: "/v2/index.php/component/jevents/crawler*/**"
      reason: non_target_jevents_view
    - id: exclude-jevents-short-path
      pattern: "/v2/component/jevents/**"
      reason: non_target_jevents_view
    - id: exclude-jevents-query
      query_param: "option=com_jevents"
      reason: non_target_jevents_view

    # System, admin, interactive/auth, and print/feed endpoints
    - id: exclude-robots-administrator
      pattern: "/v2/administrator/**"
      reason: disallowed_by_v2_robots_txt
    - id: exclude-robots-bin
      pattern: "/v2/bin/**"
      reason: disallowed_by_v2_robots_txt
    - id: exclude-robots-cache
      pattern: "/v2/cache/**"
      reason: disallowed_by_v2_robots_txt
    - id: exclude-robots-cli
      pattern: "/v2/cli/**"
      reason: disallowed_by_v2_robots_txt
    - id: exclude-robots-components
      pattern: "/v2/components/**"
      reason: disallowed_by_v2_robots_txt
    - id: exclude-robots-includes
      pattern: "/v2/includes/**"
      reason: disallowed_by_v2_robots_txt
    - id: exclude-robots-installation
      pattern: "/v2/installation/**"
      reason: disallowed_by_v2_robots_txt
    - id: exclude-robots-language
      pattern: "/v2/language/**"
      reason: disallowed_by_v2_robots_txt
    - id: exclude-robots-layouts
      pattern: "/v2/layouts/**"
      reason: disallowed_by_v2_robots_txt
    - id: exclude-robots-libraries
      pattern: "/v2/libraries/**"
      reason: disallowed_by_v2_robots_txt
    - id: exclude-robots-logs
      pattern: "/v2/logs/**"
      reason: disallowed_by_v2_robots_txt
    - id: exclude-robots-modules
      pattern: "/v2/modules/**"
      reason: disallowed_by_v2_robots_txt
    - id: exclude-robots-plugins
      pattern: "/v2/plugins/**"
      reason: disallowed_by_v2_robots_txt
    - id: exclude-robots-tmp
      pattern: "/v2/tmp/**"
      reason: disallowed_by_v2_robots_txt
    - id: exclude-system-registration
      pattern: "/v2/index.php/registration*"
      reason: system_auth_endpoint
    - id: exclude-system-search
      pattern: "/v2/index.php/component/search*"
      reason: system_search_endpoint
    - id: exclude-system-users
      pattern: "/v2/index.php/component/users*"
      reason: system_users_endpoint
    - id: exclude-system-mailto
      pattern: "/v2/index.php/component/mailto*"
      reason: system_mailto_endpoint
    - id: exclude-query-feed
      query_param: "format=feed"
      reason: system_feed_variant
    - id: exclude-query-opensearch
      query_param: "format=opensearch"
      reason: system_opensearch_variant
    - id: exclude-query-tmpl-component
      query_param: "tmpl=component"
      reason: system_component_print_variant
    - id: exclude-query-print
      query_param: "print=1"
      reason: system_print_variant

# Approvals begin empty in Phase 0.
# Populate via human review (or `pdn-sync scope approve` / `scope import`) after Phase 1 discovery.
    - id: exclude-decorative-sampledata
