# PDN Multimodal Knowledge Sync — Phase 3 Retrieval Evaluation Benchmark
# Owner-reviewed set of 40 Malay (22) and English (18) questions grounded strictly
# in Gate-B-approved PDN resources (non-JEvents Track 1).
schema_version: 1
description: >-
  40 realistic Malay and English chatbot questions covering donor eligibility,
  deferrals, operating hours, static donation centres, blood supply status,
  hotlines, FAQs, clinical PDF guidelines, corporate info, and PDPA-safe staff
  directory lookups.

questions:
  # --- 1. Donor Eligibility & Deferrals (10 questions: 5 MS, 5 EN) ---
  - id: q01_basic_criteria_ms
    lang: ms
    category: eligibility_deferral
    query: Apakah syarat asas kelayakan umur dan berat badan untuk menderma darah di PDN?
    expected_urls:
      - https://pdn.gov.my/v2/images/poster/PosterKriteriaPendermaanDarah.jpg
      - https://pdn.gov.my/v2/images/poster/2024/Kad_Kecil_Kriteria_Pendermaan_Darah.jpg
      - https://pdn.gov.my/v2/index.php/informasi/bahan-pendidikan-2
    expected_facts:
      - "45kg"
      - "17"
    search_target: knowledge

  - id: q02_basic_criteria_en
    lang: en
    category: eligibility_deferral
    query: What are the age limits for first-time and regular blood donors in Malaysia?
    expected_urls:
      - https://pdn.gov.my/v2/index.php/informasi/bahan-pendidikan-2
      - https://pdn.gov.my/v2/images/poster/PosterKriteriaPendermaanDarah.jpg
      - https://pdn.gov.my/v2/images/poster/2024/Kad_Kecil_Kriteria_Pendermaan_Darah.jpg
    expected_facts:
      - "60"
      - "70"
    search_target: knowledge

