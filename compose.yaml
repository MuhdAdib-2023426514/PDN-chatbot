# Optional Docker Compose deployment profiles (ADR-orchestration.md)
# Zero containers are required for local development (SQLite + local BlobStore + embedded Qdrant).
# Use `--profile qdrant` when running the background worker concurrently with the FastAPI API.

services:
  qdrant:
    image: qdrant/qdrant:v1.20.2-unprivileged
    profiles: ["qdrant", "all"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /healthz HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q \"200 OK\" <&3'"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G

volumes:
  qdrant_data:
